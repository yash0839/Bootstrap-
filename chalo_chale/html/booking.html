<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/home.css">
    <title>ChaloChale - Travel Website</title>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="home.html">
                <i class="fa-solid fa-plane-departure"></i>
                ChaloChale
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="home.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="destinations.html">Destinations</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="packages.html">Packages</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="booking.html">Booking</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>
                </ul>
                <a href="signup.html" class="btn btn-warning ms-lg-3 mt-2 mt-lg-0">Signup</a>
                <a href="login.html" class="btn btn-warning ms-lg-3 mt-2 mt-lg-0">Login</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid text-center fw-bold mb-4 mt-5">
        <h1>Travel Booking Form</h1>
        <p>Fill the form and submit your travel request</p>
    </div>

    <div class="modal-body">
        <form class="mx-5 my-5 py-5 px-5">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input type="text" id="fullName" class="form-control" placeholder="Enter your name" required>
                </div>


                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter email" required>
                </div>

            </div>


            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="destination" class="form-label">Select Destination</label>
                    <select id="destination" class="form-select" required>
                        <option value="">Choose Destination </option>
                        <option value="Goa">Goa</option>
                        <option value="Manali">Manali</option>
                        <option value="Kerala">Kerala</option>
                        <option value="Jaipur">Jaipur</option>
                    </select>
                </div>


                <div class="col-md-6 mb-3">
                    <label for="travelDate" class="form-label">
                        Travel Date
                    </label>
                    <input type="date" id="travelDate" class="form-control" required>
                </div>

            </div>


            <!-- Number of People -->
            <div class="mb-3">
                <label for="people" class="form-label">
                    Number of People
                </label>
                <input type="number" id="people" class="form-control" placeholder="Enter number of people" min="1"
                    required>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" class="form-control" rows="3" placeholder="Any special request?"></textarea>
            </div>
            <button type="submit" class="btn btn-success w-100">Submit Booking Request</button>
        </form>
    </div>

</body>

</html>
