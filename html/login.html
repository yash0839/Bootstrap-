<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/home.css">
    <title>ChaloChale - Travel Website</title>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="home.html">
                <i class="fa-solid fa-plane-departure"></i>
                ChaloChale
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="home.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="destinations.html">Destinations</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="packages.html">Packages</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="booking.html">Booking</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>
                </ul>
                <a href="signup.html" class="btn btn-warning ms-lg-3 mt-2 mt-lg-0">Signup</a>
                <a href="login.html" class="btn btn-warning ms-lg-3 mt-2 mt-lg-0">Login</a>
            </div>
        </div>
    </nav>


    <!-- Navbar End -->


    <!-- Login Form Start -->
    <section class="py-5 bg-light">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                    <div class="card shadow-lg p-4 rounded-4">

                        <h3 class="text-center fw-bold mb-4">
                            Welcome Back
                        </h3>

                        <form>

                            <!-- Email -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Email Address
                                </label>

                                <input type="email"
                                    class="form-control"
                                    placeholder="Enter email"
                                    required>

                            </div>


                            <!-- Password -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input type="password"
                                    class="form-control"
                                    placeholder="Enter password"
                                    required>

                            </div>


                            <!-- Remember Me -->
                            <div class="form-check mb-3">

                                <input class="form-check-input"
                                    type="checkbox"
                                    id="remember">

                                <label class="form-check-label"
                                    for="remember">
                                    Remember me
                                </label>

                            </div>


                            <!-- Login Button -->
                            <button type="submit"
                                class="btn btn-success w-100">
                                Login
                            </button>


                            <!-- Signup Link -->
                            <p class="text-center mt-3 mb-0">

                                Don't have an account?

                                <a href="Signup.html">
                                    Sign Up
                                </a>

                            </p>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>
    <!-- Login Form End -->


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
