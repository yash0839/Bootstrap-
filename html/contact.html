<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome -->

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/home.css">
    <title>ChaloChale - Travel Website</title>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="home.html">
                <i class="fa-solid fa-plane-departure"></i>
                ChaloChale
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="home.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="destinations.html">Destinations</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="packages.html">Packages</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="booking.html">Booking</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>
                </ul>
                <a href="signup.html" class="btn btn-warning ms-lg-3 mt-2 mt-lg-0">Signup</a>
                <a href="login.html" class="btn btn-warning ms-lg-3 mt-2 mt-lg-0">Login</a>
            </div>
        </div>
    </nav>
    
    <section class="contact-section py-5">

        <div class="container">

            <div class="card contact-card">

                <div class="row g-0">

                    <!-- Contact Information -->
                    <div class="col-lg-5 contact-info px-5 py-5 bg-success text-white">

                        <h2 class="fw-bold mb-4">Get In Touch</h2>

                        <p class="mb-4">
                            Have any questions? Feel free to contact us.
                            We would love to hear from you.
                        </p>

                        <div class="mb-4">
                            <i class="fa-solid fa-location-dot"></i>
                            <strong>Address</strong>
                            <p class="ms-4 mb-0">
                                Pune, Maharashtra, India
                            </p>
                        </div>

                        <div class="mb-4">
                            <i class="fa-solid fa-phone"></i>
                            <strong>Phone</strong>
                            <p class="ms-4 mb-0">
                                +91 98765 43210
                            </p>
                        </div>

                        <div class="mb-4">
                            <i class="fa-solid fa-envelope"></i>
                            <strong>Email</strong>
                            <p class="ms-4 mb-0">
                                contact@example.com
                            </p>
                        </div>

                        <!-- Social Icons -->
                        <div class="mt-4 ">
                            <a href="#" class="text-white me-3">
                                <i class="fa-brands fa-facebook"></i>
                            </a>

                            <a href="#" class="text-white me-3">
                                <i class="fa-brands fa-instagram"></i>
                            </a>

                            <a href="#" class="text-white me-3">
                                <i class="fa-brands fa-twitter"></i>
                            </a>

                            <a href="#" class="text-white">
                                <i class="fa-brands fa-linkedin"></i>
                            </a>
                        </div>

                    </div>


                    <!-- Contact Form -->
                    <div class="col-lg-7 contact-form px-5 py-5">

                        <h2 class="fw-bold mb-4">Contact Us</h2>

                        <form>

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Full Name</label>
                                    <input type="text"
                                        class="form-control"
                                        placeholder="Enter your name"
                                        required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email"
                                        class="form-control"
                                        placeholder="Enter your email"
                                        required>
                                </div>

                            </div>

                            <div class="mb-3">
                                <label class="form-label">Subject</label>

                                <input type="text"
                                    class="form-control"
                                    placeholder="Enter subject"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Message</label>

                                <textarea
                                    class="form-control"
                                    rows="5"
                                    placeholder="Write your message..."
                                    required></textarea>
                            </div>

                            <button type="submit"
                                class="btn btn-dark btn-contact">
                                <i class="fa-solid fa-paper-plane me-2"></i>
                                Send Message
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
